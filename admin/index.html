<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfAI — AI Persona Platform</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --bg2: #16161a;
      --bg3: #1e1e24;
      --border: #2a2a32;
      --text: #e8e8f0;
      --text2: #9090a8;
      --accent: #7c6af7;
      --accent2: #a08fff;
      --success: #4caf7d;
      --danger: #e05252;
      --warning: #e09a30;
      --sidebar-w: 220px;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font-family: inherit; font-size: 14px; border: none; border-radius: var(--radius); transition: opacity 0.15s, background 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input, textarea, select {
      font-family: inherit; font-size: 14px; background: var(--bg);
      color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .field { margin-bottom: 18px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius); font-weight: 600; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-free { background: var(--bg3); color: var(--text2); }
    .badge-creator { background: #2d2460; color: var(--accent2); }
    .badge-pro { background: #2a1e10; color: var(--warning); }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 12px 18px; border-radius: var(--radius); color: #fff; font-weight: 500; animation: slideIn 0.2s; max-width: 320px; }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--accent); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* AUTH */
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-logo p { color: var(--text2); margin-top: 6px; }
    .auth-footer { text-align: center; margin-top: 24px; color: var(--text2); }

    /* LANDING */
    .landing { min-height: 100vh; }
    .landing-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 60px; border-bottom: 1px solid var(--border); }
    .landing-logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .landing-nav-links { display: flex; gap: 12px; }
    .hero { text-align: center; padding: 100px 20px 60px; max-width: 800px; margin: 0 auto; }
    .hero h1 { font-size: 52px; font-weight: 900; line-height: 1.1; margin-bottom: 24px; background: linear-gradient(135deg, #fff 40%, var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 20px; color: var(--text2); margin-bottom: 40px; line-height: 1.6; }
    .hero-cta { display: flex; gap: 16px; justify-content: center; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto 80px; padding: 0 40px; }
    .feature-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    .feature-icon { font-size: 32px; margin-bottom: 16px; }
    .feature-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .feature-card p { color: var(--text2); line-height: 1.6; }
    .pricing-section { max-width: 1100px; margin: 0 auto 80px; padding: 0 40px; }
    .pricing-section h2 { text-align: center; font-size: 36px; font-weight: 800; margin-bottom: 48px; }
    .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .plan-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 32px; position: relative; }
    .plan-card.popular { border-color: var(--accent); }
    .popular-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .plan-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .plan-price { font-size: 40px; font-weight: 900; margin-bottom: 4px; }
    .plan-price span { font-size: 16px; font-weight: 400; color: var(--text2); }
    .plan-features { list-style: none; margin: 24px 0; display: flex; flex-direction: column; gap: 10px; }
    .plan-features li { color: var(--text2); display: flex; gap: 10px; }
    .plan-features li::before { content: "✓"; color: var(--success); flex-shrink: 0; }

    /* APP LAYOUT */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-logo { padding: 24px 20px 20px; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sidebar-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text2); font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; font-size: 14px; }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: rgba(124, 106, 247, 0.15); color: var(--accent2); }
    .sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }
    .user-info { padding: 10px 12px; margin-bottom: 8px; }
    .user-email { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .user-name { font-size: 14px; font-weight: 600; }
    .main { margin-left: var(--sidebar-w); flex: 1; padding: 32px; max-width: calc(100vw - var(--sidebar-w)); }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 26px; font-weight: 800; }
    .page-header p { color: var(--text2); margin-top: 6px; }

    /* DASHBOARD */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-label { font-size: 12px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 800; }

    /* PERSONAS */
    .personas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .persona-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: border-color 0.15s; }
    .persona-card:hover { border-color: var(--accent); }
    .persona-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #f06f9a); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
    .persona-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .persona-meta { font-size: 12px; color: var(--text2); margin-bottom: 14px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab { padding: 10px 16px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--text2); font-weight: 500; border: none; background: transparent; font-size: 14px; transition: all 0.15s; border-bottom: 2px solid transparent; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* PRODUCTS */
    .product-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .product-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .product-info { flex: 1; }
    .product-name { font-weight: 600; margin-bottom: 2px; }
    .product-meta { font-size: 12px; color: var(--text2); }
    .product-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* IMAGES */
    .image-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .image-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .image-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .image-card-info { padding: 10px 12px; }
    .image-card-style { font-size: 12px; color: var(--text2); }
    .image-card-actions { padding: 8px 12px; display: flex; gap: 8px; border-top: 1px solid var(--border); }

    /* CONTENT */
    .content-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .content-caption { margin-bottom: 12px; line-height: 1.6; }
    .content-hashtags { font-size: 12px; color: var(--accent2); line-height: 1.8; }
    .content-meta { font-size: 11px; color: var(--text2); margin-top: 10px; display: flex; gap: 16px; }
    .trend-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .trend-title { font-weight: 700; margin-bottom: 8px; }
    .trend-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .trend-list li { color: var(--text2); font-size: 13px; display: flex; gap: 8px; }
    .trend-list li::before { content: "→"; color: var(--accent); flex-shrink: 0; }

    /* BILLING */
    .current-plan-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; }
    .current-plan-info h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .current-plan-info p { color: var(--text2); }

    /* MISC */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .row { display: flex; gap: 12px; align-items: flex-start; }
    .row .field { flex: 1; }
    .chip { display: inline-block; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; margin: 2px; cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    .toggle { position: relative; width: 44px; height: 24px; background: var(--bg3); border-radius: 12px; cursor: pointer; transition: background 0.2s; border: 1px solid var(--border); display: inline-block; flex-shrink: 0; }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after { content: ""; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
    .toggle.on::after { transform: translateX(20px); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prompt-preview { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 13px; line-height: 1.7; color: var(--text2); white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; }
    .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .style-option { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; text-align: center; transition: all 0.15s; }
    .style-option:hover { border-color: var(--accent); }
    .style-option.selected { border-color: var(--accent); background: rgba(124,106,247,0.1); }
    .style-option .style-icon { font-size: 24px; margin-bottom: 6px; }
    .style-option .style-name { font-size: 12px; font-weight: 600; }
    .connection-status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: var(--success); }
    .dot-red { background: var(--danger); }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>
<div id="app"></div>

<script>
// ============================================================
//  STATE
// ============================================================
var state = {
  token: localStorage.getItem('token'),
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  view: 'landing',
  params: {},
  personas: [],
  currentPersona: null,
  products: [],
  images: [],
  content: [],
  trendAnalysis: null,
  igStatus: null,
  activeTab: 'profile',
  selectedStyle: 'fashion editorial',
  _productModal: null,
  _systemPromptPreview: '',
  _imgNsfw: false,
};

// ============================================================
//  UTILS
// ============================================================
function toast(msg, type) {
  type = type || 'info';
  var c = document.getElementById('toast-container');
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3500);
}

function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  return fetch(path, Object.assign({ headers: headers }, opts)).then(function(res) {
    return res.json().catch(function() { return {}; }).then(function(data) {
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    });
  });
}

function setToken(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
}

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  navigate('landing');
}

function navigate(view, params) {
  state.view = view;
  state.params = params || {};
  render();
}

function isAuthed() {
  return !!state.token;
}

function planBadge(plan) {
  var cls = { free: 'badge-free', creator: 'badge-creator', pro: 'badge-pro' }[plan] || 'badge-free';
  return '<span class="badge ' + cls + '">' + ((plan || 'free').toUpperCase()) + '</span>';
}

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleDateString('sk-SK');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  RENDER ROUTER
// ============================================================
function render() {
  var app = document.getElementById('app');
  if (!isAuthed() && ['dashboard','personas','persona-edit','avatars','content','instagram','billing'].indexOf(state.view) !== -1) {
    state.view = 'landing';
  }
  switch (state.view) {
    case 'landing': app.innerHTML = renderLanding(); break;
    case 'login': app.innerHTML = renderLogin(); break;
    case 'register': app.innerHTML = renderRegister(); break;
    case 'dashboard': app.innerHTML = renderApp(renderDashboard()); break;
    case 'personas': app.innerHTML = renderApp(renderPersonasList()); break;
    case 'persona-edit': app.innerHTML = renderApp(renderPersonaEdit()); break;
    case 'avatars': app.innerHTML = renderApp(renderAvatars()); break;
    case 'content': app.innerHTML = renderApp(renderContent()); break;
    case 'instagram': app.innerHTML = renderApp(renderInstagram()); break;
    case 'billing': app.innerHTML = renderApp(renderBilling()); break;
    default: app.innerHTML = renderApp(renderDashboard());
  }
  attachHandlers();
}

// ============================================================
//  APP LAYOUT
// ============================================================
function renderApp(inner) {
  var navItems = [
    { id: 'dashboard', icon: '📊', label: 'Dashboard' },
    { id: 'personas', icon: '👤', label: 'Persony' },
    { id: 'avatars', icon: '🎨', label: 'Avatar Studio' },
    { id: 'content', icon: '📱', label: 'Obsah' },
    { id: 'instagram', icon: '📸', label: 'Instagram' },
    { id: 'billing', icon: '💳', label: 'Billing' },
  ];
  var nav = navItems.map(function(n) {
    return '<button class="nav-item ' + (state.view === n.id ? 'active' : '') + '" onclick="navigate(\'' + n.id + '\')">' + n.icon + ' ' + n.label + '</button>';
  }).join('');

  var u = state.user || {};
  return '<div class="app-layout">' +
    '<aside class="sidebar">' +
      '<div class="sidebar-logo">OfAI</div>' +
      '<nav class="sidebar-nav">' + nav + '</nav>' +
      '<div class="sidebar-footer">' +
        '<div class="user-info">' +
          '<div class="user-name">' + escHtml(u.name) + '</div>' +
          '<div class="user-email">' + escHtml(u.email) + ' ' + planBadge(u.plan) + '</div>' +
        '</div>' +
        '<button class="nav-item" onclick="logout()">🚪 Odhlásiť sa</button>' +
      '</div>' +
    '</aside>' +
    '<main class="main">' + inner + '</main>' +
  '</div>';
}

// ============================================================
//  LANDING
// ============================================================
function renderLanding() {
  var features = [
    { icon: '🤖', title: 'AI Persony', desc: 'Vytvor viacero unikátnych AI persón s vlastnou osobnosťou, tónom a backstory.' },
    { icon: '💬', title: 'Automatické DM', desc: 'AI odpovedá na Instagram správy 24/7 presne v štýle tvojej persony.' },
    { icon: '🎨', title: 'Avatar Generátor', desc: 'Generuj fotorealistické avatary pomocou xAI Aurora modelu.' },
    { icon: '📱', title: 'Content Studio', desc: 'Generuj captions, hashtagy a obsah pre posty, reels a stories.' },
    { icon: '📈', title: 'Analýza trendov', desc: 'Grok analyzuje aktuálne trendy a navrhne vírusové content stratégie.' },
    { icon: '💰', title: 'Predaj produktov', desc: 'Integruj svoje produkty a AI ich prirodzene propaguje v konverzáciách.' },
  ];
  var plans = [
    { name: 'Free', price: 0, popular: false, features: ['1 AI Persona', 'Instagram DM automatizácia', 'História konverzácií', 'Manuálne správy'] },
    { name: 'Creator', price: 29, popular: true, features: ['3 AI Persony', 'Instagram DM automatizácia', '50 AI avatarov/mesiac', 'Generovanie obsahu', 'Analýza trendov', 'Integrácia produktov'] },
    { name: 'Pro', price: 79, popular: false, features: ['Neobmedzené persony', 'Instagram DM automatizácia', 'Neobmedzené avatary', 'Neobmedzený obsah', 'NSFW obsah (voliteľné)', 'Prioritná podpora'] },
  ];

  return '<div class="landing">' +
    '<nav class="landing-nav">' +
      '<div class="landing-logo">OfAI</div>' +
      '<div class="landing-nav-links">' +
        '<button class="btn btn-secondary" onclick="navigate(\'login\')">Prihlásiť sa</button>' +
        '<button class="btn btn-primary" onclick="navigate(\'register\')">Začať zadarmo</button>' +
      '</div>' +
    '</nav>' +
    '<div class="hero">' +
      '<h1>Tvoja AI persona, ktorá predáva 24/7</h1>' +
      '<p>Vytvor si realistickú AI personu, automatizuj Instagram DM konverzácie a generuj obsah s pomocou umelej inteligencie.</p>' +
      '<div class="hero-cta">' +

        '<div class="section-title" style="margin-bottom:16px">✍️ Generovať obsah</div>' +
        '<div class="field"><label>Persona</label><select id="content-persona">' + personaOpts + '</select></div>' +
        '<div class="field"><label>Typ obsahu</label><select id="content-type"><option value="post">Post</option><option value="reel">Reel</option><option value="story">Story</option></select></div>' +
        '<button class="btn btn-primary" onclick="generateContent()" id="gen-content-btn">Generovať obsah</button>' +
      '</div>' +
    '</div>' +
    trendSection +
    '<div>' +
      '<div class="section-header"><div class="section-title">Vygenerovaný obsah</div><span style="font-size:12px;color:var(--text2)">' + state.content.length + ' položiek</span></div>' +
      contentList +
    '</div>';
}

// ============================================================
//  INSTAGRAM
// ============================================================
function renderInstagram() {
  var conn = state.igStatus;
  var personaOpts = '<option value="">Žiadna (použije predvolenú)</option>' +
    state.personas.map(function(p) {
      var sel = conn && conn.connected && conn.connection && conn.connection.persona_id == p.id ? 'selected' : '';
      return '<option value="' + p.id + '" ' + sel + '>' + escHtml(p.name) + '</option>';
    }).join('');

  return '<div class="page-header"><h1>Instagram Pripojenie 📸</h1><p>Správa Instagram Business účtu pre AI DM automatizáciu</p></div>' +
    '<div class="card" style="margin-bottom:24px">' +
      '<div class="connection-status" style="margin-bottom:20px">' +
        '<div class="dot ' + (conn && conn.connected ? 'dot-green' : 'dot-red') + '"></div>' +
        '<span style="font-weight:600">' + (conn && conn.connected ? 'Pripojené' : 'Nepripojené') + '</span>' +
        (conn && conn.connected ? '<span style="color:var(--text2)">@' + escHtml(conn.connection.ig_username || conn.connection.ig_account_id) + '</span>' : '') +
      '</div>' +
      (conn && conn.connected ? '<button class="btn btn-danger btn-sm" onclick="disconnectIG()">Odpojiť účet</button>' : '') +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title" style="margin-bottom:20px">' + (conn && conn.connected ? 'Aktualizovať pripojenie' : 'Pripojiť Instagram účet') + '</div>' +
      '<div class="field"><label>Instagram Account ID *</label><input id="ig-account-id" value="' + escHtml((conn && conn.connected && conn.connection.ig_account_id) || '') + '" placeholder="Tvoj IG Business Account ID"></div>' +
      '<div class="field"><label>Používateľské meno</label><input id="ig-username" value="' + escHtml((conn && conn.connected && conn.connection.ig_username) || '') + '" placeholder="@tvoj_profil"></div>' +
      '<div class="field"><label>Access Token *</label><input id="ig-token" type="password" placeholder="EAAxxxxxx..."></div>' +
      '<div class="field"><label>Priradená persona (pre DM odpovede)</label><select id="ig-persona">' + personaOpts + '</select></div>' +
      '<button class="btn btn-primary" onclick="saveIG()" id="save-ig-btn">' + (conn && conn.connected ? 'Aktualizovať' : 'Pripojiť') + '</button>' +
      '<div style="margin-top:20px;padding:16px;background:var(--bg3);border-radius:8px;font-size:13px;color:var(--text2)">' +
        '<strong style="color:var(--text)">Ako nastaviť:</strong><br>' +
        '1. Vytvor Meta App na developers.facebook.com<br>' +
        '2. Pridaj Instagram Graph API<br>' +
        '3. Vygeneruj dlhodobý access token<br>' +
        '4. Nastav webhook URL: <code>https://tvoja-domena.com/webhook</code>' +
      '</div>' +
    '</div>';
}

// ============================================================
//  BILLING
// ============================================================
function renderBilling() {
  var u = state.user || {};
  var plans = [
    { id: 'free', name: 'Free', price: 0, features: ['1 AI Persona','Instagram DM automatizácia','História konverzácií','Manuálne správy'], current: u.plan === 'free' },
    { id: 'creator', name: 'Creator', price: 29, popular: true, features: ['3 AI Persony','50 avatarov/mesiac','Generovanie obsahu','Analýza trendov','Integrácia produktov'], current: u.plan === 'creator' },
    { id: 'pro', name: 'Pro', price: 79, features: ['Neobmedzené persony','Neobmedzené avatary','Neobmedzený obsah','NSFW obsah','Prioritná podpora'], current: u.plan === 'pro' },
  ];

  return '<div class="page-header"><h1>Billing 💳</h1><p>Správa predplatného a platieb</p></div>' +
    '<div class="current-plan-card">' +
      '<div class="current-plan-info">' +
        '<h3>Aktuálny plán: ' + planBadge(u.plan) + '</h3>' +
        '<p>' + (u.plan_expires_at ? 'Platný do: ' + fmtDate(u.plan_expires_at) : u.plan === 'free' ? 'Bezplatný plán' : 'Aktívne predplatné') + '</p>' +
      '</div>' +
      (u.plan !== 'free' ? '<button class="btn btn-secondary" onclick="openPortal()">Spravovať predplatné →</button>' : '') +
    '</div>' +
    '<div class="pricing-grid">' +
      plans.map(function(p) {
        var btn;
        if (p.current) {
          btn = '<button class="btn btn-secondary" style="width:100%" disabled>Aktuálny plán</button>';
        } else if (p.id === 'free') {
          btn = '<button class="btn btn-secondary" style="width:100%" disabled>Základný</button>';
        } else {
          btn = '<button class="btn btn-primary" style="width:100%" onclick="startCheckout(\'' + p.id + '\')">Upgradovať na ' + p.name + '</button>';
        }
        return '<div class="plan-card ' + (p.popular ? 'popular' : '') + '">' +
          (p.popular ? '<div class="popular-badge">Odporúčame</div>' : '') +
          '<div class="plan-name">' + p.name + '</div>' +
          '<div class="plan-price">$' + p.price + '<span>/mesiac</span></div>' +
          '<ul class="plan-features">' + p.features.map(function(f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' +
          btn +
        '</div>';
      }).join('') +
    '</div>';
}

// ============================================================
//  ATTACH HANDLERS
// ============================================================
function attachHandlers() {
  var loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.onsubmit = function(e) {
      e.preventDefault();
      var btn = document.getElementById('login-btn');
      var fd = new FormData(loginForm);
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Prihlasovanie...';
      api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
      }).then(function(data) {
        setToken(data.token, data.user);
        return loadInitialData();
      }).then(function() {
        navigate('dashboard');
        toast('Vitaj späť!', 'success');
      }).catch(function(err) {
        toast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Prihlásiť sa';
      });
    };
  }

  var regForm = document.getElementById('register-form');
  if (regForm) {
    regForm.onsubmit = function(e) {
      e.preventDefault();
      var btn = document.getElementById('register-btn');
      var fd = new FormData(regForm);
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Registrácia...';
      api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({ email: fd.get('email'), password: fd.get('password'), name: fd.get('name') }),
      }).then(function(data) {
        setToken(data.token, data.user);
        return loadInitialData();
      }).then(function() {
        navigate('dashboard');
        toast('Účet bol vytvorený!', 'success');
      }).catch(function(err) {
        toast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Vytvoriť účet';
      });
    };
  }

  if (state.view === 'dashboard') {
    api('/api/images').then(function(d) {
      var el = document.getElementById('dash-images');
      if (el) el.textContent = d.total || 0;
    }).catch(function() {});
    api('/api/content').then(function(d) {
      var el = document.getElementById('dash-content');
      if (el) el.textContent = d.total || 0;
    }).catch(function() {});
  }

  var overlay = document.getElementById('prod-overlay');
  if (overlay) {
    overlay.onclick = function(e) {
      if (e.target === overlay) closeProductModal();
    };
  }
}

// ============================================================
//  ACTIONS
// ============================================================
function setTab(tab) {
  state.activeTab = tab;
  render();
}

function addTrait(trait) {
  var el = document.getElementById('p-personality');
  if (!el) return;
  var cur = el.value.trim();
  if (cur.indexOf(trait) === -1) {
    el.value = cur ? cur + ', ' + trait : trait;
  }
}

function selectStyle(style) {
  state.selectedStyle = style;
  render();
}

function openProductModal(idOrObj) {
  if (typeof idOrObj === 'number' && idOrObj > 0) {
    var found = state.products.filter(function(p) { return p.id === idOrObj; })[0];
    state._productModal = found || {};
  } else {
    state._productModal = {};
  }
  render();
}

function closeProductModal() {
  state._productModal = null;
  render();
}

function startNewPersona() {
  state.currentPersona = { is_active: 1 };
  state.products = [];
  state.activeTab = 'profile';
  state._systemPromptPreview = '';
  state._productModal = null;
  navigate('persona-edit');
}

function editPersona(id) {
  api('/api/personas/' + id).then(function(data) {
    state.currentPersona = data.persona;
    state.products = data.products;
    state._systemPromptPreview = data.systemPrompt;
    state.activeTab = 'profile';
    state._productModal = null;
    navigate('persona-edit');
  }).catch(function(err) { toast(err.message, 'error'); });
}

function savePersona() {
  var btn = document.getElementById('save-persona-btn');
  var p = state.currentPersona || {};
  var isNew = !p.id;
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>'; }

  var body = {
    name: (document.getElementById('p-name') && document.getElementById('p-name').value.trim()) || '',
    age: parseInt((document.getElementById('p-age') && document.getElementById('p-age').value) || '22', 10),
    nationality: (document.getElementById('p-nationality') && document.getElementById('p-nationality').value.trim()) || 'European',
    bio: (document.getElementById('p-bio') && document.getElementById('p-bio').value.trim()) || '',
    personality: (document.getElementById('p-personality') && document.getElementById('p-personality').value.trim()) || '',
    tone: (document.getElementById('p-tone') && document.getElementById('p-tone').value.trim()) || '',
    avatar_prompt: (document.getElementById('p-avatar-prompt') && document.getElementById('p-avatar-prompt').value.trim()) || '',
    is_active: document.getElementById('toggle-active') && document.getElementById('toggle-active').classList.contains('on') ? 1 : 0,
    is_nsfw_enabled: document.getElementById('toggle-nsfw') && document.getElementById('toggle-nsfw').classList.contains('on') ? 1 : 0,
  };

  if (!body.name) {
    toast('Meno persony je povinné', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = isNew ? 'Vytvoriť personu' : 'Uložiť zmeny'; }
    return;
  }

  var url = isNew ? '/api/personas' : '/api/personas/' + p.id;
  var method = isNew ? 'POST' : 'PUT';

  api(url, { method: method, body: JSON.stringify(body) }).then(function(data) {
    state.currentPersona = data.persona;
    toast(isNew ? 'Persona vytvorená!' : 'Zmeny uložené!', 'success');
    return refreshPersonas().then(function() {
      return api('/api/personas/' + state.currentPersona.id);
    });
  }).then(function(full) {
    state._systemPromptPreview = full.systemPrompt;
    state.products = full.products;
    if (btn) { btn.disabled = false; btn.innerHTML = 'Uložiť zmeny'; }
    render();
  }).catch(function(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = isNew ? 'Vytvoriť personu' : 'Uložiť zmeny'; }
  });
}

function deletePersona(id) {
  if (!confirm('Naozaj chceš zmazať túto personu?')) return;
  api('/api/personas/' + id, { method: 'DELETE' }).then(function() {
    return refreshPersonas();
  }).then(function() {
    toast('Persona zmazaná', 'success');
    navigate('personas');
  }).catch(function(err) { toast(err.message, 'error'); });
}

function saveProduct(existingId) {
  var personaId = state.currentPersona && state.currentPersona.id;
  if (!personaId) { toast('Najprv ulož personu', 'error'); return; }

  var body = {
    name: (document.getElementById('prod-name') && document.getElementById('prod-name').value.trim()) || '',
    description: (document.getElementById('prod-desc') && document.getElementById('prod-desc').value.trim()) || '',
    price: parseFloat((document.getElementById('prod-price') && document.getElementById('prod-price').value) || '0'),
    currency: (document.getElementById('prod-currency') && document.getElementById('prod-currency').value) || 'USD',
    type: (document.getElementById('prod-type') && document.getElementById('prod-type').value) || 'photo_pack',
  };

  if (!body.name || isNaN(body.price)) { toast('Názov a cena sú povinné', 'error'); return; }

  var url = existingId ? '/api/personas/' + personaId + '/products/' + existingId : '/api/personas/' + personaId + '/products';
  var method = existingId ? 'PUT' : 'POST';

  api(url, { method: method, body: JSON.stringify(body) }).then(function() {
    return api('/api/personas/' + personaId);
  }).then(function(full) {
    state.products = full.products;
    state._systemPromptPreview = full.systemPrompt;
    state._productModal = null;
    toast(existingId ? 'Produkt aktualizovaný' : 'Produkt pridaný', 'success');
    render();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function deleteProduct(id) {
  if (!confirm('Zmazať produkt?')) return;
  var personaId = state.currentPersona && state.currentPersona.id;
  api('/api/personas/' + personaId + '/products/' + id, { method: 'DELETE' }).then(function() {
    return api('/api/personas/' + personaId);
  }).then(function(full) {
    state.products = full.products;
    state._systemPromptPreview = full.systemPrompt;
    toast('Produkt zmazaný', 'success');
    render();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function generateImage() {
  var personaId = document.getElementById('img-persona') && document.getElementById('img-persona').value;
  if (!personaId) { toast('Vyber personu', 'error'); return; }

  var style = state.selectedStyle;
  if (style === 'custom') {
    var customText = document.getElementById('custom-style-text') && document.getElementById('custom-style-text').value.trim();
    if (!customText) { toast('Zadaj vlastný štýl', 'error'); return; }
    style = customText;
  }

  var isNsfw = state._imgNsfw || false;
  var btn = document.getElementById('gen-img-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Generujem...'; }

  api('/api/images/generate', {
    method: 'POST',
    body: JSON.stringify({ persona_id: parseInt(personaId, 10), style: style, is_nsfw: isNsfw }),
  }).then(function(data) {
    state.images.unshift(data.image);
    toast('Avatar vygenerovaný!', 'success');
    render();
  }).catch(function(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '🎨 Generovať avatar'; }
  });
}

function deleteImage(id) {
  if (!confirm('Zmazať obrázok?')) return;
  api('/api/images/' + id, { method: 'DELETE' }).then(function() {
    state.images = state.images.filter(function(i) { return i.id !== id; });
    toast('Obrázok zmazaný', 'success');
    render();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function analyzeTrends() {
  var topic = document.getElementById('trend-topic') && document.getElementById('trend-topic').value.trim();
  var btn = document.getElementById('trends-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Analyzujem...'; }

  api('/api/content/trends', {
    method: 'POST',
    body: JSON.stringify({ topic: topic || undefined }),
  }).then(function(data) {
    state.trendAnalysis = data.analysis;
    toast('Analýza dokončená!', 'success');
    render();
  }).catch(function(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = 'Analyzovať trendy'; }
  });
}

function generateContent() {
  var personaId = document.getElementById('content-persona') && document.getElementById('content-persona').value;
  var contentType = document.getElementById('content-type') && document.getElementById('content-type').value;
  if (!personaId) { toast('Vyber personu', 'error'); return; }

  var btn = document.getElementById('gen-content-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Generujem...'; }

  api('/api/content/generate', {
    method: 'POST',
    body: JSON.stringify({
      persona_id: parseInt(personaId, 10),
      content_type: contentType || 'post',
      trend_data: state.trendAnalysis || undefined,
    }),
  }).then(function(data) {
    state.content.unshift(data.content);
    toast('Obsah vygenerovaný!', 'success');
    render();
  }).catch(function(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = 'Generovať obsah'; }
  });
}

function copyContent(id) {
  var item = state.content.filter(function(c) { return c.id === id; })[0];
  if (!item) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(item.caption + '\n\n' + item.hashtags).then(function() {
      toast('Skopírované!', 'success');
    });
  }
}

function deleteContentItem(id) {
  if (!confirm('Zmazať obsah?')) return;
  api('/api/content/' + id, { method: 'DELETE' }).then(function() {
    state.content = state.content.filter(function(c) { return c.id !== id; });
    toast('Zmazané', 'success');
    render();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function saveIG() {
  var accountId = document.getElementById('ig-account-id') && document.getElementById('ig-account-id').value.trim();
  var token = document.getElementById('ig-token') && document.getElementById('ig-token').value.trim();
  var username = document.getElementById('ig-username') && document.getElementById('ig-username').value.trim();
  var personaId = document.getElementById('ig-persona') && document.getElementById('ig-persona').value;
  if (!accountId || !token) { toast('Account ID a token sú povinné', 'error'); return; }

  var btn = document.getElementById('save-ig-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>'; }

  api('/api/instagram/connect', {
    method: 'POST',
    body: JSON.stringify({
      ig_account_id: accountId,
      ig_username: username || undefined,
      access_token: token,
      persona_id: personaId ? parseInt(personaId, 10) : undefined,
    }),
  }).then(function() {
    return loadIGStatus();
  }).then(function() {
    toast('Instagram prepojený!', 'success');
    render();
  }).catch(function(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = 'Pripojiť'; }
  });
}

function disconnectIG() {
  if (!confirm('Odpojiť Instagram účet?')) return;
  api('/api/instagram/disconnect', { method: 'DELETE' }).then(function() {
    state.igStatus = { connected: false };
    toast('Instagram odpojený', 'success');
    render();
  }).catch(function(err) { toast(err.message, 'error'); });
}

function startCheckout(plan) {
  api('/api/billing/checkout', {
    method: 'POST',
    body: JSON.stringify({
      plan: plan,
      success_url: window.location.origin + '/admin-ui/#billing',
      cancel_url: window.location.origin + '/admin-ui/#billing',
    }),
  }).then(function(data) {
    window.location.href = data.url;
  }).catch(function(err) { toast(err.message, 'error'); });
}

function openPortal() {
  api('/api/billing/portal?return_url=' + encodeURIComponent(window.location.href)).then(function(data) {
    window.location.href = data.url;
  }).catch(function(err) { toast(err.message, 'error'); });
}

// ============================================================
//  DATA LOADING
// ============================================================
function refreshPersonas() {
  return api('/api/personas').then(function(data) {
    state.personas = data.personas || [];
  }).catch(function() {});
}

function loadIGStatus() {
  return api('/api/instagram/status').then(function(data) {
    state.igStatus = data;
  }).catch(function() {});
}

function loadImages() {
  return api('/api/images').then(function(data) {
    state.images = data.images || [];
  }).catch(function() {});
}

function loadContent() {
  return api('/api/content').then(function(data) {
    state.content = data.content || [];
  }).catch(function() {});
}

function refreshUser() {
  return api('/api/auth/me').then(function(data) {
    state.user = data;
    localStorage.setItem('user', JSON.stringify(data));
  }).catch(function() {});
}

function loadInitialData() {
  return Promise.all([refreshUser(), refreshPersonas(), loadIGStatus(), loadImages(), loadContent()]);
}

// ============================================================
//  INIT
// ============================================================
(function init() {
  if (isAuthed()) {
    loadInitialData().then(function() {
      var hash = window.location.hash.replace('#', '').split('?')[0];
      var validViews = ['dashboard','personas','avatars','content','instagram','billing'];
      navigate(validViews.indexOf(hash) !== -1 ? hash : 'dashboard');
    });
  } else {
    navigate('landing');
  }
})();
</script>
</body>
